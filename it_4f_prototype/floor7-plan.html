<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IT융합대학 7층 구조 검토도</title>
  <link rel="stylesheet" href="./src/floor3-plan.css" />
  <link rel="stylesheet" href="./src/floor6-plan.css" />
</head>
<body>
<main class="plan-shell">
  <section class="plan-layout">
    <div class="plan-stage">
      <svg id="floorPlan" viewBox="0 0 1500 780" role="img" aria-labelledby="planTitle planDesc">
        <title id="planTitle">IT융합대학 7층 표준 본동 평면 구조</title>
        <desc id="planDesc">6층 공통 고정 코어와 계단 위치를 재사용하고, 7층 피난안내도 사진과 대조한 호실 순서·폭 기준으로 배치한 2D 구조도이다.</desc>
        <defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#e7ebef" /></pattern></defs>
        <rect class="sheet-grid" x="20" y="20" width="1460" height="740" />
        <text class="layer-title" x="690" y="54">7층 표준 본동 · 6~10층 공통 고정틀</text>

        <g class="inherited-shell" transform="translate(0 200)">
          <path class="common-frame floor6-common-frame" d="M70 120H1263.5V230H1353.2 M70 120V404H1353.2V230" />
          <rect class="main-corridor" x="70" y="230" width="1283.2" height="64" />
          <text x="690" y="268">메인 복도 · 표준층 공통틀</text>

          <g class="left-end-stair"><rect x="25" y="294" width="45" height="110" /><path class="stair-step" d="M34 314h27m-27 12h27m-27 12h27m-27 12h27m-27 12h27m-27 12h27" /><text transform="translate(48 350) rotate(-90)">왼쪽계단</text></g>

          <g class="room-row floor6-rooms">
            <!-- Left upper row: starts at the main-restroom right edge (x=630). -->
            <rect x="70" y="120" width="93.33" height="110" /><rect x="163.33" y="120" width="46.67" height="110" /><rect x="210" y="120" width="46.67" height="110" /><rect x="256.67" y="120" width="93.33" height="110" />
            <rect x="350" y="120" width="93.33" height="110" /><rect x="443.33" y="120" width="46.67" height="110" /><rect x="490" y="120" width="46.67" height="110" /><rect x="536.67" y="120" width="93.33" height="110" />
            <text x="116.665" y="175">7128</text><text x="186.665" y="175">7126</text><text x="233.335" y="175">7125</text><text x="303.335" y="175">7123</text><text x="396.665" y="175">7122</text><text x="466.665" y="175">7120</text><text x="513.335" y="175">7119</text><text x="583.335" y="175">7117</text>
            <text class="floor6-row-label" x="350" y="98">왼쪽복도 위쪽 · 메인 화장실 오른쪽선 기준</text>

            <!-- 7225 ends on the same vertical line as 7123; 7221 fills to the core. -->
            <rect x="70" y="294" width="93.33" height="110" /><rect x="163.33" y="294" width="46.67" height="110" /><rect x="210" y="294" width="140" height="110" /><rect x="350" y="294" width="220" height="110" />
            <text x="116.665" y="349">7228</text><text x="186.665" y="349">7226</text><text x="280" y="349">7225</text><text x="460" y="349">7221</text>
            <text class="floor6-row-label" x="320" y="430">왼쪽복도 아래쪽 · 코어 왼쪽선 기준</text>
          </g>

          <g class="core-module">
            <rect x="570" y="294" width="230" height="250" /><rect class="restroom-core" x="570" y="294" width="60" height="250" /><rect class="facility ev-bank" x="630" y="294" width="60" height="250" />
            <rect class="facility ev-car" x="642" y="314" width="34" height="64" /><rect class="facility ev-car" x="642" y="394" width="34" height="64" /><line class="core-separator" x1="630" y1="294" x2="630" y2="544" /><line class="core-separator" x1="690" y1="294" x2="690" y2="544" />
            <rect class="core-corridor" x="690" y="294" width="42" height="250" /><rect class="stair-box" x="752" y="336" width="36" height="180" /><path class="stair-step" d="M758 352h24m-24 13h24m-24 13h24m-24 13h24m-24 13h24m-24 13h24m-24 13h24m-24 13h24m-24 13h24" />
            <text class="core-side-label" x="600" y="419" transform="rotate(-90 600 419)">메인 화장실</text><text x="660" y="346">EV</text><text x="660" y="426">EV</text><text x="660" y="494">엘레베이터 2대</text><text x="711" y="318">코어복도</text><text x="770" y="530">메인계단</text>
          </g>

          <g class="room-row floor6-rooms">
            <!-- Right upper row: starts at the main-stair left edge (x=752). -->
            <rect x="752" y="120" width="93" height="110" /><rect x="845" y="120" width="46.5" height="110" /><rect x="891.5" y="120" width="46.5" height="110" /><rect x="938" y="120" width="93" height="110" />
            <rect x="1031" y="120" width="93" height="110" /><rect x="1124" y="120" width="46.5" height="110" /><rect x="1170.5" y="120" width="46.5" height="110" /><rect x="1217" y="120" width="64.5" height="110" />
            <text x="798.5" y="175">7114</text><text class="floor6-small-room" x="868.25" y="175">7112</text><text class="floor6-small-room" x="914.75" y="175">7111</text><text x="984.5" y="175">7109</text><text x="1077.5" y="175">7108</text><text class="floor6-small-room" x="1147.25" y="175">7106</text><text class="floor6-small-room" x="1193.75" y="175">7105</text><text x="1249.25" y="175">7103</text>
            <text class="floor6-row-label" x="1031" y="98">오른쪽복도 위쪽 · 메인계단 왼쪽선 기준</text>

            <!-- 7212 ends at 7111's right line; 7210 ends at 7108's right line. -->
            <rect x="800" y="294" width="46.5" height="110" /><rect x="846.5" y="294" width="91.5" height="110" /><rect x="938" y="294" width="186" height="110" /><rect x="1124" y="294" width="157.5" height="110" />
            <text class="floor6-small-room" x="823.25" y="349">7213</text><text x="892.25" y="349">7212</text><text x="1031" y="349">7210</text><text x="1202.75" y="349">7206</text>
            <text class="floor6-row-label" x="1026" y="430">오른쪽복도 아래쪽 · 코어 오른쪽선 기준</text>
          </g>

          <g class="end-facilities">
            <!-- Fixed right stair; 7202 is the one room reached through this passage. -->
            <rect x="1299.2" y="294" width="18" height="58" /><text transform="translate(1308.2 323) rotate(-90)">통로</text><rect class="floor6-stair-entry" x="1335.2" y="294" width="18" height="58" /><text class="floor6-stair-zone" transform="translate(1344.2 323) rotate(-90)">계단 입구</text>
            <rect class="floor6-room-6202" x="1281.5" y="352" width="71.7" height="52" /><path class="floor6-6202-boundary" d="M1281.5 352H1299.2 M1317.2 352H1353.2V404H1281.5V352" /><line class="floor6-6202-door" x1="1299.2" y1="352" x2="1317.2" y2="352" /><text class="floor6-6202-label" x="1317.35" y="378">7202</text>
            <rect class="floor6-stair-flight" x="1353.2" y="294" width="72" height="58" /><path class="stair-step" d="M1359.2 304h60m-60 8h60m-60 8h60m-60 8h60m-60 8h60m-60 8h60" /><text class="floor6-stair-zone" transform="translate(1389.2 323) rotate(-90)">12+12계단</text><rect class="floor6-stair-landing" x="1425.2" y="294" width="36" height="58" /><text class="floor6-stair-zone" transform="translate(1443.2 323) rotate(-90)">중간참</text><text x="1389.2" y="370">오른쪽계단</text>
          </g>
        </g>
      </svg>
    </div>
  </section>
</main>
</body>
</html>
