<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LiDAR GLB Viewer</title>
    <link rel="icon" href="data:," />
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7fb;
        --panel: #ffffff;
        --ink: #172033;
        --muted: #697386;
        --line: #dbe3ef;
        --blue: #2563eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: Arial, "Malgun Gothic", sans-serif;
      }

      main {
        width: min(1120px, calc(100vw - 24px));
        margin: 0 auto;
        padding: 24px 0;
      }

      .layout {
        display: grid;
        grid-template-columns: 1fr 330px;
        gap: 14px;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 18px 50px rgba(19, 32, 59, 0.12);
      }

      .viewer-panel {
        min-height: 620px;
        overflow: hidden;
      }

      model-viewer {
        width: 100%;
        height: 620px;
        background:
          linear-gradient(#eef4fb 1px, transparent 1px),
          linear-gradient(90deg, #eef4fb 1px, transparent 1px),
          #ffffff;
        background-size: 32px 32px;
      }

      .side {
        padding: 18px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 1.25;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }

      label {
        display: grid;
        gap: 6px;
        margin-top: 16px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      select {
        height: 38px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 10px;
        background: #fff;
        color: var(--ink);
        font: inherit;
      }

      .info {
        display: grid;
        gap: 8px;
        margin-top: 16px;
      }

      .item {
        padding: 11px;
        border: 1px solid #edf2f7;
        border-radius: 8px;
        background: #fbfdff;
      }

      .item span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }

      .item strong {
        display: block;
        margin-top: 5px;
        font-size: 15px;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
      }

      button {
        min-height: 36px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 11px;
        background: #ffffff;
        color: #344054;
        font-weight: 700;
        cursor: pointer;
      }

      button.primary {
        border-color: var(--blue);
        background: var(--blue);
        color: #ffffff;
      }

      .note {
        margin-top: 16px;
        padding: 12px;
        border-radius: 8px;
        background: #eaf1ff;
        color: #1e3a8a;
      }

      @media (max-width: 880px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .viewer-panel,
        model-viewer {
          height: 520px;
          min-height: 520px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="layout">
        <section class="panel viewer-panel">
          <model-viewer
            id="viewer"
            src="../../web/assets/3f/it_3f_right_wing.glb"
            camera-controls
            touch-action="pan-y"
            auto-rotate
            shadow-intensity="0.7"
            exposure="1"
            ar
            ar-modes="webxr scene-viewer quick-look"
            alt="iPhone LiDAR로 촬영한 실내 GLB 모델"
          ></model-viewer>
        </section>

        <aside class="panel side">
          <h1>LiDAR 스캔 테스트</h1>
          <p id="description">4층 엘레베이터와 일부 메인계단 구역을 확인하는 GLB 모델이야.</p>

          <label>
            스캔 선택
            <select id="scanSelect">
              <option value="it_3f_right_wing">3층 오른쪽 복도/IT홀 확장부</option>
              <option value="it_4f_elevator_stairs">4층 엘레베이터/메인계단 일부</option>
              <option value="it_4f_left_from_elevator_right_wing">4층 엘레베이터 기준 왼쪽 복도</option>
              <option value="it_4f_right_from_elevator_left_wing">4층 엘레베이터 기준 오른쪽 복도</option>
              <option value="home_test">집 테스트 스캔</option>
            </select>
          </label>

          <div class="info">
            <div class="item"><span>파일</span><strong id="fileLabel">it_4f_elevator_stairs.glb</strong></div>
            <div class="item"><span>모델 범위</span><strong id="sizeLabel">약 12.77 × 8.94 × 8.55</strong></div>
            <div class="item"><span>활용 방향</span><strong id="useLabel">엘레베이터 허브/계단 구조 참고</strong></div>
            <div class="item"><span>보기 모드</span><strong id="viewModeLabel">원본 컬러</strong></div>
          </div>

          <div class="controls">
            <button id="resetView" class="primary" type="button">시점 초기화</button>
            <button id="toggleMono" type="button">단색 구조 보기</button>
            <button id="toggleRotate" type="button">자동 회전 끄기</button>
          </div>

          <p class="note">
            학교 모델은 LiDAR 원본을 그대로 쓰기보다, 스캔을 참고해서 엘레베이터,
            계단, 복도, 강의실 위치가 잘 보이는 단순 3D 구조로 다시 만드는 쪽이 좋아.
          </p>
        </aside>
      </div>
    </main>

    <script>
      const scans = {
        it_3f_right_wing: {
          color: "../../web/assets/3f/it_3f_right_wing.glb",
          mono: "../../web/assets/3f/it_3f_right_wing.glb",
          file: "it_3f_right_wing.glb",
          size: "약 39.82 × 7.38 × 53.04",
          use: "3층 오른쪽 복도, 사이드계단, IT홀 및 저층 확장부 정합",
          description: "3층 오른쪽 복도에서 사이드계단과 IT홀 입구를 거쳐 저층 확장부로 연결되는 원본 GLB 스캔이야. 문과 개구부의 1차 근거로 사용해."
        },
        it_4f_elevator_stairs: {
          color: "./assets/it_4f_elevator_stairs.glb",
          mono: "./assets/it_4f_elevator_stairs_mono.glb",
          file: "it_4f_elevator_stairs.glb",
          size: "약 12.77 × 8.94 × 8.55",
          use: "엘레베이터 허브/계단 구조 참고",
          description: "4층 엘레베이터와 일부 메인계단 구역을 확인하는 GLB 모델이야."
        },
        it_4f_left_from_elevator_right_wing: {
          color: "./assets/it_4f_left_from_elevator_right_wing.glb",
          mono: "./assets/it_4f_left_from_elevator_right_wing_mono.glb",
          file: "it_4f_left_from_elevator_right_wing.glb",
          size: "약 62.51 × 3.55 × 36.20",
          use: "엘레베이터 기준 왼쪽 복도, 정문 기준 건물 오른쪽 구역",
          description: "엘레베이터에서 내려 왼쪽으로 이동하는 복도 스캔이야. 엘레베이터 가까운 부분은 3D 참고, 먼 구간은 평면도 기준으로 쓰면 좋아."
        },
        it_4f_right_from_elevator_left_wing: {
          color: "./assets/it_4f_right_from_elevator_left_wing.glb",
          mono: "./assets/it_4f_right_from_elevator_left_wing_mono.glb",
          file: "it_4f_right_from_elevator_left_wing.glb",
          size: "약 8.53 × 8.63 × 58.39",
          use: "엘레베이터 기준 오른쪽 복도, 정문 기준 건물 왼쪽 구역",
          description: "엘레베이터에서 내려 오른쪽으로 이동하는 긴 복도 스캔이야. 정문에서 건물을 봤을 때는 왼쪽 부분으로 정리하면 돼."
        },
        home_test: {
          color: "./assets/scan.glb",
          mono: "./assets/scan_mono.glb",
          file: "scan.glb",
          size: "약 2.79 × 2.38 × 3.81",
          use: "스캔 모델 + 지도 좌표 매핑 테스트",
          description: "집에서 찍은 GLB 모델을 웹에서 확인하는 초기 테스트야."
        }
      };

      const viewer = document.querySelector("#viewer");
      const scanSelect = document.querySelector("#scanSelect");
      const resetView = document.querySelector("#resetView");
      const toggleMono = document.querySelector("#toggleMono");
      const toggleRotate = document.querySelector("#toggleRotate");
      const viewModeLabel = document.querySelector("#viewModeLabel");
      const fileLabel = document.querySelector("#fileLabel");
      const sizeLabel = document.querySelector("#sizeLabel");
      const useLabel = document.querySelector("#useLabel");
      const description = document.querySelector("#description");
      let isMono = false;

      function currentScan() {
        return scans[scanSelect.value];
      }

      function applyScan() {
        const scan = currentScan();
        viewer.setAttribute("src", isMono ? scan.mono : scan.color);
        fileLabel.textContent = scan.file;
        sizeLabel.textContent = scan.size;
        useLabel.textContent = scan.use;
        description.textContent = scan.description;
        viewModeLabel.textContent = isMono ? "단색 구조" : "원본 컬러";
        toggleMono.textContent = isMono ? "원본 컬러 보기" : "단색 구조 보기";
      }

      resetView.addEventListener("click", () => {
        viewer.cameraOrbit = "0deg 75deg auto";
        viewer.fieldOfView = "30deg";
        viewer.jumpCameraToGoal();
      });

      toggleRotate.addEventListener("click", () => {
        viewer.autoRotate = !viewer.autoRotate;
        toggleRotate.textContent = viewer.autoRotate ? "자동 회전 끄기" : "자동 회전 켜기";
      });

      toggleMono.addEventListener("click", () => {
        isMono = !isMono;
        applyScan();
      });

      scanSelect.addEventListener("change", () => {
        applyScan();
      });

      applyScan();
    </script>
  </body>
</html>
