<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>자유 위치 추적 시험</title>
<style>body{font:16px/1.6 system-ui;margin:18px;color:#18344d}select,button{font:inherit;padding:10px;margin:4px;border:1px solid #bed0df;border-radius:8px;background:#f0f5ff}#pose{font-size:24px;font-weight:700}.card{padding:14px;background:#eef3fb;border-radius:12px;margin:14px 0}#status{color:#425673}</style></head><body>
<h2>자유 위치 추적 시험</h2><p>시작 위치를 정한 뒤 자유롭게 걸어보세요. 종료하면 Android Downloads/IndoorPositioning에 센서와 추정 로그가 저장됩니다.</p>
<label>시작 층 <select id="floor"></select></label><label>시작점 <select id="start"><option value="70.804">코어 교차영역</option><option value="3.363100346020758">오른쪽 계단 입구</option><option value="135.407">왼쪽 계단 입구</option></select></label>
<label>시험 방식 <select id="mode"><option value="pdr">1. PDR+지도</option><option value="mag">2. +자기장 격자/V2</option><option value="ble">3. +BLE</option><option value="mag_ble" selected>4. +자기장 격자/V2+BLE</option></select></label>
<button id="begin" disabled>측정 시작</button><button id="stop" disabled>종료·저장</button>
<label><input id="ap" type="checkbox" checked> 모드 4에서 AP 이벤트 보정 사용</label>
<div class="card"><div id="pose">준비 중</div><div id="rooms"></div><div id="details"></div></div><p id="status">공용 모델을 읽는 중입니다.</p>
<p>현재 위치는 실험용 추정입니다. 모드 4의 AP는 기준점 접근·걸음 동반 방향 전환·추적 불확실 시 요청하며, 신호가 애매하면 같은 사건에서 최대 2회 요청합니다. BLE와 자기장은 계속 관측합니다. AP 사용을 끄면 이전 조건과 비교할 수 있습니다.</p>
<script src="src/positioning/navigation.js"></script><script src="src/positioning/vertical-tracker.js"></script><script src="src/positioning/fusion-engine.js"></script><script src="src/positioning/zone-classifier.js"></script><script src="src/positioning/sequence.js"></script><script src="src/positioning/quality.js"></script><script src="src/positioning/runtime.js"></script><script src="src/positioning/android-experiment.js"></script>
</body></html>
