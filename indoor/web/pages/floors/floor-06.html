<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IT융합대학 6층 구조 검토도</title>
  <link rel="stylesheet" href="../../src/floors/floor-03.css" />
  <link rel="stylesheet" href="../../src/floors/floor-06.css" />
</head>
<body>
<main class="plan-shell">
  <section class="plan-layout">
    <div class="plan-stage">
      <svg id="floorPlan" viewBox="0 0 1500 780" role="img" aria-labelledby="planTitle planDesc">
        <title id="planTitle">IT융합대학 6층 표준 본동 평면 구조</title>
        <desc id="planDesc">6층부터 10층까지 공통으로 적용할 고정 코어와 계단, 화장실 통로 및 6층 강의실 행을 표시한 2D 구조도.</desc>
        <defs>
          <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#e7ebef" /></pattern>
          <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2f6f61" /></marker>
        </defs>
        <rect class="sheet-grid" x="20" y="20" width="1460" height="740" />
        <text class="layer-title" x="690" y="54">6층 표준 본동 · 6~10층 공통 고정틀</text>

        <g class="inherited-shell" transform="translate(0 200)">
          <!-- Fixed core: left wing 500 units, right wing 553.2 units (64.44m : 58.24m). -->
          <path class="common-frame floor6-common-frame" d="M70 120H1263.5V230H1353.2 M70 120V404H1353.2V230" />
          <rect class="main-corridor" x="70" y="230" width="1283.2" height="64" />
          <text x="690" y="268">메인 복도 · 표준층 공통틀</text>

          <g class="left-end-stair">
            <rect x="25" y="294" width="45" height="110" />
            <path class="stair-step" d="M34 314h27m-27 12h27m-27 12h27m-27 12h27m-27 12h27m-27 12h27" />
            <text transform="translate(48 350) rotate(-90)">왼쪽계단</text>
          </g>

          <g class="room-row floor6-rooms">
            <!-- 왼쪽복도 위쪽: 메인 화장실 오른쪽선(x=630)에서 시작 -->
            <rect x="70" y="120" width="93.33" height="110" /><rect x="163.33" y="120" width="46.67" height="110" /><rect x="210" y="120" width="46.67" height="110" />
            <rect x="256.67" y="120" width="93.33" height="110" /><rect x="350" y="120" width="93.33" height="110" /><rect x="443.33" y="120" width="46.67" height="110" />
            <rect x="490" y="120" width="46.67" height="110" /><rect x="536.67" y="120" width="93.33" height="110" />
            <text x="116.665" y="175">6128</text><text x="186.665" y="175">6126</text><text x="233.335" y="175">6125</text>
            <text x="303.335" y="175">6123</text><text x="396.665" y="175">6122</text><text x="466.665" y="175">6120</text>
            <text x="513.335" y="175">6119</text><text x="583.335" y="168">6117</text><text class="floor6-lab-note" x="583.335" y="190">광응용계측·디지털신호처리 실험실</text>
            <text class="floor6-row-label" x="350" y="98">왼쪽복도 위쪽 · 메인 화장실 오른쪽선 기준</text>

            <!-- 왼쪽복도 아래쪽: 코어 왼쪽선(x=570)에서 시작 -->
            <rect x="70" y="294" width="93.33" height="110" /><rect x="163.33" y="294" width="46.67" height="110" /><rect x="210" y="294" width="170" height="110" /><rect x="380" y="294" width="190" height="110" />
            <text x="116.665" y="349">6228</text><text x="186.665" y="349">6226</text><text x="295" y="349">6225</text><text x="475" y="349">6221</text>
            <text class="floor6-row-label" x="320" y="430">왼쪽복도 아래쪽 · 코어 왼쪽선 기준</text>
          </g>

          <g class="core-module">
            <rect x="570" y="294" width="230" height="250" />
            <rect class="restroom-core" x="570" y="294" width="60" height="250" />
            <rect class="facility ev-bank" x="630" y="294" width="60" height="250" />
            <rect class="facility ev-car" x="642" y="314" width="34" height="64" />
            <rect class="facility ev-car" x="642" y="394" width="34" height="64" />
            <line class="core-separator" x1="630" y1="294" x2="630" y2="544" />
            <line class="core-separator" x1="690" y1="294" x2="690" y2="544" />
            <rect class="core-corridor" x="690" y="294" width="42" height="250" />
            <rect class="stair-box" x="752" y="336" width="36" height="180" />
            <path class="stair-step" d="M758 352h24m-24 13h24m-24 13h24m-24 13h24m-24 13h24m-24 13h24m-24 13h24m-24 13h24m-24 13h24" />
            <text class="core-side-label" x="600" y="419" transform="rotate(-90 600 419)">메인 화장실</text>
            <text x="660" y="346">EV</text><text x="660" y="426">EV</text><text x="660" y="494">엘레베이터 2대</text>
            <text x="711" y="318">코어복도</text><text x="770" y="530">메인계단</text>
          </g>

          <g class="room-row floor6-rooms">
            <!-- 오른쪽복도 위쪽: 메인계단 왼쪽선(x=752)에서 시작 -->
            <rect x="750" y="120" width="95" height="110" /><rect x="845" y="120" width="46.5" height="110" /><rect x="891.5" y="120" width="46.5" height="110" />
            <rect x="938" y="120" width="93" height="110" /><rect x="1031" y="120" width="46.5" height="110" /><rect x="1077.5" y="120" width="46.5" height="110" /><rect x="1124" y="120" width="157.5" height="110" />
            <text x="797.5" y="175">6114</text><text class="floor6-small-room" x="868.25" y="175">6112</text><text class="floor6-small-room" x="914.75" y="175">6111</text>
            <text x="984.5" y="175">6109</text><text class="floor6-small-room" x="1054.25" y="175">6108</text><text class="floor6-small-room" x="1100.75" y="175">6108-1</text><text x="1202.75" y="175">6103</text>
            <text class="floor6-row-label" x="1031" y="98">오른쪽복도 위쪽 · 메인계단 왼쪽선 기준</text>
            <!-- 6103 is preserved as a rectangle; the outer boundary turns back as an L. -->

            <!-- 오른쪽복도 아래쪽: 코어 오른쪽선(x=800)에서 시작 -->
            <rect x="800" y="294" width="46.5" height="110" /><rect x="846.5" y="294" width="93" height="110" /><rect x="939.5" y="294" width="184.5" height="110" /><rect x="1124" y="294" width="157.5" height="110" />
            <text class="floor6-small-room" x="823.25" y="349">6213</text><text x="893" y="349">6212</text><text x="1009.25" y="349">6210</text><text x="1202.75" y="349">6203</text>
            <text class="floor6-row-label" x="1026" y="430">오른쪽복도 아래쪽 · 코어 오른쪽선 기준</text>
          </g>

          <g class="end-facilities">
            <rect x="1299.2" y="294" width="18" height="58" />
            <text transform="translate(1308.2 323) rotate(-90)">통로</text>
            <rect class="floor6-stair-entry" x="1335.2" y="294" width="18" height="58" />
            <text class="floor6-stair-zone" transform="translate(1344.2 323) rotate(-90)">계단 입구</text>

            <!-- 6202 is accessed only through the door below the passage. -->
            <rect class="floor6-room-6202" x="1281.5" y="352" width="71.7" height="52" />
            <path class="floor6-6202-boundary" d="M1281.5 352H1299.2 M1317.2 352H1353.2V404H1281.5V352" />
            <line class="floor6-6202-door" x1="1299.2" y1="352" x2="1317.2" y2="352" />
            <text class="floor6-6202-label" x="1317.35" y="378">6202</text>

            <rect class="floor6-stair-flight" x="1353.2" y="294" width="72" height="58" />
            <path class="stair-step" d="M1359.2 304h60m-60 8h60m-60 8h60m-60 8h60m-60 8h60m-60 8h60" />
            <text class="floor6-stair-zone" transform="translate(1389.2 323) rotate(-90)">12+12계단</text>
            <rect class="floor6-stair-landing" x="1425.2" y="294" width="36" height="58" />
            <text class="floor6-stair-zone" transform="translate(1443.2 323) rotate(-90)">중간참</text>
            <text x="1389.2" y="370">오른쪽계단</text>
          </g>
        </g>
      </svg>
    </div>
  </section>
</main>
</body>
</html>
