<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IT융합대학 2D 지도</title>
    <link rel="stylesheet" href="./src/styles.css?v=map-orientation-2" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1 id="pageTitle">IT융합대학 2D 지도</h1>
          <p id="pageSubtitle">1층부터 9층까지 평면 배치를 빠르게 전환해서 확인합니다.</p>
        </div>
        <div class="top-actions">
          <a class="link-button" href="./clay.html">클레이 3D 보기</a>
          <a class="link-button secondary" href="./pdr.html">알고리즘 테스트</a>
          <div id="mapBadge" class="badge">4F map graph v0.4</div>
        </div>
      </header>

      <section class="layout">
        <div class="map-card">
          <div class="map-toolbar">
            <div class="floor-tabs" aria-label="2D 층 선택">
              <button type="button" data-floor-tab="1">1F</button>
              <button type="button" data-floor-tab="2">2F</button>
              <button class="active" type="button" data-floor-tab="3">3F</button>
              <button type="button" data-floor-tab="4">4F</button>
              <button type="button" data-floor-tab="5">5F</button>
              <button type="button" data-floor-tab="6">6F</button>
              <button type="button" data-floor-tab="7">7F</button>
              <button type="button" data-floor-tab="8">8F</button>
              <button type="button" data-floor-tab="9">9F</button>
              <button type="button" data-floor-tab="10">10F</button>
            </div>
            <label id="targetField">
              목적지
              <select id="targetSelect"></select>
            </label>
            <button id="resetButton" type="button">시점 초기화</button>
            <label class="checkbox">
              <input id="labelToggle" type="checkbox" checked />
              전체 강의실 번호 보기
            </label>
          </div>
          <div class="svg-wrap" data-floor-view="4">
            <svg id="mapSvg" viewBox="0 0 980 500" role="img" aria-label="IT융합대학 4층 복도와 강의실 배치도"></svg>
          </div>
          <div id="floor1Host" class="floor-plan-inline-wrap" data-floor-view="1" role="img" aria-label="IT융합대학 1층 2D 구조도">
            <div class="loading-note">1층 2D 지도를 불러오는 중</div>
          </div>
          <div id="floor2Host" class="floor-plan-inline-wrap" data-floor-view="2" role="img" aria-label="IT융합대학 2층 2D 구조도">
            <div class="loading-note">2층 2D 지도를 불러오는 중</div>
          </div>
          <div id="floor3Host" class="floor3-inline-wrap" data-floor-view="3" role="img" aria-label="IT융합대학 3층 2D 구조도">
            <div class="loading-note">3층 2D 지도를 불러오는 중</div>
          </div>
          <div id="floor5Host" class="floor-plan-inline-wrap" data-floor-view="5" role="img" aria-label="IT융합대학 5층 2D 구조도">
            <div class="loading-note">5층 2D 지도를 불러오는 중</div>
          </div>
          <div id="floor6Host" class="floor-plan-inline-wrap" data-floor-view="6" role="img" aria-label="IT융합대학 6층 2D 구조도">
            <div class="loading-note">6층 2D 지도를 불러오는 중</div>
          </div>
          <div id="floor7Host" class="floor-plan-inline-wrap" data-floor-view="7" role="img" aria-label="IT융합대학 7층 2D 구조도">
            <div class="loading-note">7층 2D 지도를 불러오는 중</div>
          </div>
          <div id="floor8Host" class="floor-plan-inline-wrap" data-floor-view="8" role="img" aria-label="IT융합대학 8층 2D 구조도">
            <div class="loading-note">8층 2D 지도를 불러오는 중</div>
          </div>
          <div id="floor9Host" class="floor-plan-inline-wrap" data-floor-view="9"><div class="loading-note">9층 2D 지도를 불러오는 중</div></div>
          <div id="floor10Host" class="floor-plan-inline-wrap" data-floor-view="10"><div class="loading-note">10층 2D 지도를 불러오는 중</div></div>
        </div>
      </section>

      <section class="notes">
        <h2>현재 모델 기준</h2>
        <ul id="mapNotes"></ul>
      </section>
    </main>

  <script type="module" src="./src/map-2d.js?v=floor10-10202-pink-2"></script>
  </body>
</html>
